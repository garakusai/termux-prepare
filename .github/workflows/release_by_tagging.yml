name: release by tagging

on:
  push:
    tags:
      - 'v*'

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Call packages.yml
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TRIGGER_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh workflow run packages.yml \
            --ref "$TAG_NAME" \
            -f packages=llama-cpp-stb

